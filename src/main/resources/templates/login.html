<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #888888;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #2d2d2d;
            border-radius: 15px;
        }
        .form-control {
            background-color: #00000;
            border: 1px solid #3d3d3d;
            color: #000000;
        }
        .form-control:focus {
            background-color: #ffffff;
            color: #000000;
            border-color: #0d6efd;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow-lg">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Email Sender</h2>
                    <p class="text-muted small">Ingresa tus credenciales SMTP de Gmail para continuar</p>
                </div>

                <div th:if="${error}" class="alert alert-danger role='alert' small py-2">
                    <span th:text="${error}">Error al iniciar sesión</span>
                </div>

                <form th:action="@{/login}" method="POST">
                    <div class="mb-3">
                        <label for="correo" class="form-label text-muted small">Correo Electrónico (Gmail)</label>
                        <input type="email" class="form-control" id="correo" name="correo" placeholder="usuario@gmail.com" required autocomplete="email">
                    </div>
                    <div class="mb-4">
                        <label for="contrasena" class="form-label text-muted small">Contraseña de Aplicación de Google</label>
                        <input type="password" class="form-control" id="contrasena" name="contrasenia" placeholder="•••• •••• •••• ••••" required autocomplete="current-password">
                        <div class="form-text text-muted" style="font-size: 0.75rem;">
                            Por seguridad, usa una Contraseña de Aplicación generada en tu cuenta de Google, no tu contraseña maestra.
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Autenticar e Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
